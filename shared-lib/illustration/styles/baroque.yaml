name: baroque
description: 17世纪在意大利发展并传向欧洲的艺术风格，与教会和宫廷的宏大委托密切相关。绘画中的斜线构图、强烈明暗、旋转姿态，常与雕塑和建筑共同营造戏剧现场，使观众仿佛被卷入...
