  - 核心特征：巴洛克油画，戏剧性明暗对比，定向光，丰富的织物和油画质感，深红金黑色，斜向动态构图

  - 英文艺术关键词：Baroque oil painting, dramatic chiaroscuro, directional light, rich fabric
  and oil texture, deep red gold and black, diagonal dynamic composition

  - 严格保持该流派独有的材质质感、笔触与光影氛围

  - 构图讲究，色彩层次丰富和谐

  - 图中不要有任何文字、标签、水印或说明

  '
