name: blue-green-landscape
description: 青绿山水因以石青、石绿等矿物颜料描绘山石而得名，在中国山水画中有悠久传统。画家先组织山形与线条，再以层层设色建立峰峦的厚度和装饰感；颜色浓艳时可呈现富丽境界，较...
prompt_template: '青绿山水风格：

  - 核心特征：青绿山水，细致轮廓，孔雀石和绿松石矿物颜料，点缀金色，层叠的山峦与云雾

  - 英文艺术关键词：blue-green Chinese landscape, fine outlines, azurite and malachite mineral
  pigments, touches of gold, layered mountains and clouds

  - 严格保持该流派独有的材质质感、笔触与光影氛围

