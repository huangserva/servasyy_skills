# 掐丝珐琅风格（来自 Vibeshot 风格图谱）
name: cloisonne-enamel
description: 先用金属丝在胎体上围出图案区隔，再填入珐琅料烧制和打磨，掐丝一词描述了金属线分隔色块的工序。细线像边框一样勾住明亮釉色，形成清楚而精密的装饰，中国景泰蓝是这一工...

