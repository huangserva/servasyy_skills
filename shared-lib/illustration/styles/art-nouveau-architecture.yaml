description: 新艺术运动建筑风格，强调自然有机形态、植物藤蔓流线与优美铁艺锻造。
prompt_template: '新艺术运动建筑风格 (Art Nouveau Architecture)：

  - 核心特征：有机自然曲线，高迪/霍塔式流线立面，锻铁植物藤蔓阑珊，彩色花窗玻璃，自然雕塑形态

  - 英文艺术关键词：Art Nouveau architectural facade, organic whip-lash curved wrought iron,
  natural floral motifs, stained glass window, fluid stone sculpting

  - 材质光影：精细石雕、铜绿锻铁与暖日光影穿透彩绘玻璃

  - 图中不要有任何文字、标签、水印或说明'
