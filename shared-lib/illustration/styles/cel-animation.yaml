prompt_template: '经典手绘逐帧动画风格 (Classic Hand-Drawn Cel Animation)：

  - 核心特征：吉卜力/迪士尼黄金时代纯手绘感，温暖水彩/不透明水粉背景，灵动流畅的角色动态线条

  - 英文艺术关键词：Golden era hand-drawn frame-by-frame animation, painted background, fluid
  character movement, nostalgic anime film still

  - 材质光影：温暖自然日光，丰富云层与微风动势，胶片呼吸感

  - 图中不要有任何文字、标签、水印或说明'
