name: claymorphic-ui
description: 名称把黏土与形态结合，用来描述像软陶或充气玩具般饱满的界面元素，由设计师 Michał Malewicz 加以命名推广。大圆角、柔和内外阴影和浅色表面形成可触摸...
prompt_template: '黏土拟态界面风格：

  - 核心特征：黏土拟态，圆润的3D界面卡片，厚实柔和的阴影，黏土质感体积，柔和色彩，大圆角半径

  - 英文艺术关键词：claymorphism, rounded 3D UI cards, thick soft shadows, clay-like volume,
  pastel colors, large corner radius

  - 严格保持该流派独有的材质质感、笔触与光影氛围

  - 构图讲究，色彩层次丰富和谐

  - 图中不要有任何文字、标签、水印或说明

  '
